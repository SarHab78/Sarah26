<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF7E8">
<title>Find Your Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF7E8; --card:#FFFFFF; --ink:#2A1E2E; --muted:#796B78;
    --line:#D9E9D2; --tile:#FFFFFF; --gold:#E0A92E;
    --pink:#FF3D8B; --orange:#FF8A3D; --yellow:#FFC928;
    --green:#3FD16B; --sky:#27B6F0; --purple:#9B5DE5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-weight:500;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    padding:0 0 calc(118px + env(safe-area-inset-bottom));
  }
  /* paper-chain garland across the top, like the real room */
  .garland{display:flex;gap:3px;padding:7px 0 11px;overflow:hidden}
  .garland i{flex:1 0 auto;height:17px;width:21px;border-radius:5px;display:block}
  .garland i:nth-child(6n+1){background:var(--pink);transform:rotate(-4deg)}
  .garland i:nth-child(6n+2){background:var(--orange);transform:rotate(3deg)}
  .garland i:nth-child(6n+3){background:var(--yellow);transform:rotate(-2deg)}
  .garland i:nth-child(6n+4){background:var(--green);transform:rotate(4deg)}
  .garland i:nth-child(6n+5){background:var(--sky);transform:rotate(-3deg)}
  .garland i:nth-child(6n+6){background:var(--purple);transform:rotate(2deg)}

  /* confetti dots, fixed behind everything and never under running text */
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.42;
    background-image:
      radial-gradient(circle at 5% 11%,  #FF3D8B 0 6px, transparent 7px),
      radial-gradient(circle at 94% 16%, #27B6F0 0 7px, transparent 8px),
      radial-gradient(circle at 16% 29%, #FFC928 0 5px, transparent 6px),
      radial-gradient(circle at 84% 38%, #3FD16B 0 6px, transparent 7px),
      radial-gradient(circle at 7% 49%,  #9B5DE5 0 5px, transparent 6px),
      radial-gradient(circle at 96% 58%, #FF8A3D 0 6px, transparent 7px),
      radial-gradient(circle at 13% 68%, #27B6F0 0 5px, transparent 6px),
      radial-gradient(circle at 90% 77%, #FF3D8B 0 6px, transparent 7px),
      radial-gradient(circle at 20% 88%, #3FD16B 0 5px, transparent 6px),
      radial-gradient(circle at 80% 95%, #9B5DE5 0 6px, transparent 7px);
  }
  /* a little gold, for the chairs and the star garlands */
  .sparkle{position:fixed;inset:0;z-index:-1;pointer-events:none}
  .sparkle span{position:absolute;color:var(--gold);font-size:17px;opacity:.5;line-height:1}
  .sparkle span:nth-child(1){top:7%;left:24%;font-size:13px}
  .sparkle span:nth-child(2){top:22%;right:9%}
  .sparkle span:nth-child(3){top:44%;left:6%;font-size:12px}
  .sparkle span:nth-child(4){top:61%;right:19%;font-size:20px}
  .sparkle span:nth-child(5){top:79%;left:11%}
  .sparkle span:nth-child(6){top:93%;right:7%;font-size:13px}

  .wrap{max-width:580px;margin:0 auto;position:relative;padding:0 14px}

  header{padding:26px 2px 16px;text-align:center}
  h1{
    margin:0;font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.05;
    background:linear-gradient(95deg,var(--pink),#F2711C 22%,#D99A1F 40%,
                #27A857 58%,#1E92D4 76%,var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin:8px auto 0;font-size:19px;font-weight:600;line-height:1.3;color:var(--muted)}

  /* ---------- your word ---------- */
  .mine{
    background:var(--card);border:2px solid var(--line);border-radius:20px;
    padding:14px 16px;margin:0 0 16px;text-align:center;
    box-shadow:0 3px 0 rgba(42,30,46,.06)
  }
  .mine .lab{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .mine b{display:block;font-size:30px;font-weight:700;line-height:1.15;margin-top:3px;letter-spacing:-.3px}
  .mine button{
    margin-top:9px;appearance:none;border:2px solid var(--line);background:var(--bg);color:var(--muted);
    font:inherit;font-weight:600;font-size:14px;padding:7px 16px;border-radius:999px;cursor:pointer
  }
  .mine.prompt{
    background:linear-gradient(95deg,var(--pink),var(--orange) 50%,var(--purple));border-color:transparent;
    color:#fff;font-size:19px;font-weight:600;padding:18px 16px;
    box-shadow:0 4px 0 rgba(42,30,46,.12)
  }

  /* ---------- phase 2: hunt for your people ---------- */
  var $hunt = document.getElementById("hunt"), $bar = document.querySelector(".bar");

  function myTeammates(){
    var mg = myGroup();
    if(!mg) return [];
    return PEOPLE.filter(function(p){
      return p.groupId === mg.id && p.word !== state.mine;
    });
  }

  var peeking = false;

  function renderHunt(){
    var mg = myGroup();
    var mates = myTeammates();
    var inHunt = mg && state.solved.indexOf(mg.id) > -1 && mates.length > 0;

    if(!inHunt){
      $hunt.classList.add("hide");
      $grid.classList.remove("hide");
      $bar.classList.remove("hide");
      return;
    }

    var found = state.found.filter(function(w){
      return mates.some(function(m){ return m.word === w; });
    });
    var complete = found.length === mates.length;

    /* once you are hunting, the grid is noise - keep it one tap away */
    $grid.classList.toggle("hide", !peeking);
    $bar.classList.toggle("hide", !peeking);
    $hunt.classList.remove("hide");

    if(complete){
      $hunt.className = "done";
      $hunt.innerHTML =
        "<h2>🎉 Team complete!</h2>" +
        '<div class="time">' + mg.name + "</div><ul>" +
        [{display: state.name || "You", word: state.mine}].concat(mates).map(function(p){
          return "<li>" + p.display + "<span>" + p.word + "</span></li>";
        }).join("") +
        "</ul>";
      return;
    }

    $hunt.className = "hunt";
    $hunt.innerHTML =
      "<h2>Now go find them</h2>" +
      '<div class="prog">' + found.length + " of " + mates.length +
        " found · go ask people what their word is</div>" +
      '<form id="huntform" autocomplete="off">' +
        '<input id="mate" type="text" autocapitalize="words" autocorrect="off" ' +
               'spellcheck="false" placeholder="Their first name">' +
        '<button type="submit" class="add">Add</button>' +
      "</form>" +
      '<div class="slots">' +
        mates.map(function(m){
          var got = found.indexOf(m.word) > -1;
          return '<div class="slot' + (got ? " got" : "") + '"' +
                 (got ? ' style="background:' + mg.color + ';color:' + inkOn(mg.color) + '"' : "") +
                 '><span class="w">' + m.word + '</span>' +
                 '<span class="n">' + (got ? m.display : "who has this?") + "</span></div>";
        }).join("") +
      "</div>" +
      '<p class="say" id="huntsay"></p>' +
      '<button class="peek" id="peek">' + (peeking ? "hide the board" : "peek at the board") + "</button>";

    document.getElementById("peek").onclick = function(){ peeking = !peeking; render(); };

    document.getElementById("huntform").onsubmit = function(e){
      e.preventDefault();
      var $mate = document.getElementById("mate"), $say = document.getElementById("huntsay");
      var raw = ($mate.value || "").trim();
      if(!raw) return;
      var q = raw.split(/\s+/)[0].toLowerCase();
      var hit = PEOPLE.filter(function(p){ return p.first === q; });

      if(!hit.length){
        $say.className = "say bad";
        $say.textContent = "No " + raw + " here — check the spelling?";
        return;
      }
      if(hit.length > 1){
        $say.className = "say bad";
        $say.textContent = "There's more than one " + hit[0].display + " — ask Sarah.";
        return;
      }
      var who = hit[0];
      if(who.word === state.mine){
        $say.className = "say bad";
        $say.textContent = "That's you!";
        return;
      }
      if(state.found.indexOf(who.word) > -1){
        $say.className = "say";
        $say.textContent = "You already found " + who.display + ".";
        $mate.value = "";
        return;
      }
      if(who.groupId !== mg.id){
        $say.className = "say bad";
        $say.textContent = who.display + " isn't on your team. Keep looking!";
        $mate.value = "";
        return;
      }
      state.found.push(who.word);
      save();
      $mate.value = "";
      render();
      var s2 = document.getElementById("huntsay");
      if(s2){ s2.className = "say good"; s2.textContent = "Got " + who.display + "!"; }
    };
  }

  /* ---------- name gate ---------- */
  .gate{
    background:var(--card);border:2px solid var(--line);border-radius:20px;
    padding:18px 16px;margin:0 0 14px;text-align:center;
    box-shadow:0 3px 0 rgba(42,30,46,.06)
  }
  .gate label{display:block;font-size:19px;font-weight:600;margin-bottom:12px}
  .gate form{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .gate input{
    flex:1 1 150px;min-width:0;font:inherit;font-size:18px;font-weight:600;text-align:center;
    padding:13px 14px;border:2px solid var(--line);border-radius:14px;
    background:var(--bg);color:var(--ink)
  }
  .gate input:focus{outline:none;border-color:var(--pink)}
  .gate button{
    appearance:none;border:0;font:inherit;font-weight:700;font-size:17px;color:#fff;
    padding:13px 22px;border-radius:999px;cursor:pointer;
    background:linear-gradient(95deg,var(--pink),var(--purple));
    box-shadow:0 3px 0 rgba(42,30,46,.18)
  }
  .gate button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,30,46,.18)}
  .gate p{margin:12px 0 0;font-size:15px;line-height:1.45;color:var(--muted);font-weight:500}
  .gate p.bad{color:#C0392B;font-weight:600}
  .gate p b{color:var(--ink)}
  .gate .alt{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;
             font-weight:600;text-decoration:underline;cursor:pointer;padding:0;box-shadow:none}
  /* beats #grid's own display rule - an id outranks a bare class */
  .hide{display:none !important}

  /* ---------- phase 2: hunt for your people ---------- */
  .hunt{background:var(--card);border:2px solid var(--line);border-radius:20px;
        padding:17px 16px;margin:0 0 14px;box-shadow:0 3px 0 rgba(42,30,46,.06)}
  .hunt h2{margin:0 0 3px;font-size:21px;font-weight:700;letter-spacing:-.3px}
  .hunt .prog{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:13px}
  .hunt form{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
  .hunt input{flex:1 1 140px;min-width:0;font:inherit;font-size:17px;font-weight:600;
    padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
  .hunt input:focus{outline:none;border-color:var(--pink)}
  .hunt .add{appearance:none;border:0;font:inherit;font-weight:700;font-size:16px;color:#fff;
    padding:12px 20px;border-radius:999px;cursor:pointer;
    background:linear-gradient(95deg,var(--pink),var(--purple));box-shadow:0 3px 0 rgba(42,30,46,.18)}
  .hunt .add:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,30,46,.18)}
  .slots{display:flex;flex-direction:column;gap:8px}
  .slot{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
        background:var(--bg);border:2px dashed var(--line)}
  .slot.got{border-style:solid;border-color:transparent}
  .slot .w{font-weight:700;font-size:16px;letter-spacing:-.2px}
  .slot .n{margin-left:auto;font-weight:600;font-size:16px;color:var(--muted)}
  .slot.got .n{color:inherit}
  .hunt .say{margin:12px 0 0;font-size:15px;line-height:1.45;font-weight:600;color:var(--muted)}
  .hunt .say.bad{color:#C0392B}
  .hunt .say.good{color:#1F8A4C}
  .hunt .peek{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;
    font-weight:600;text-decoration:underline;cursor:pointer;padding:0;margin-top:13px;box-shadow:none}
  .done{background:linear-gradient(95deg,var(--pink),var(--orange) 50%,var(--purple));
        color:#fff;border-radius:20px;padding:20px 17px;margin:0 0 14px;text-align:center;
        box-shadow:0 4px 0 rgba(42,30,46,.14)}
  .done h2{margin:0 0 4px;font-size:26px;font-weight:700}
  .done .time{font-size:16px;font-weight:600;opacity:.9}
  .done ul{list-style:none;margin:14px 0 0;padding:0;text-align:left}
  .done li{background:rgba(255,255,255,.2);border-radius:12px;padding:9px 13px;margin-bottom:7px;
           font-weight:600;font-size:16px;display:flex;gap:10px}
  .done li span{margin-left:auto;opacity:.85}

  /* ---------- solved teams ---------- */
  .team{
    border-radius:20px;padding:16px 17px;margin-bottom:11px;
    animation:pop .36s cubic-bezier(.2,1.35,.5,1);box-shadow:0 4px 0 rgba(42,30,46,.1)
  }
  @keyframes pop{from{transform:scale(.92) rotate(-1deg);opacity:0}to{transform:none;opacity:1}}
  .team .label{font-size:12px;font-weight:700;letter-spacing:.14em;opacity:.7}
  .team .name{font-size:23px;font-weight:700;margin:1px 0 7px;letter-spacing:-.3px;line-height:1.1}
  .team .ws{font-size:15px;line-height:1.55;font-weight:600;opacity:.9}
  .team.yours{box-shadow:0 0 0 4px var(--ink),0 4px 0 rgba(42,30,46,.1)}

  /* ---------- grid ---------- */
  /* 3 across on a phone: fewer, bigger, easier-to-read tiles */
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  @media (min-width:470px){#grid{grid-template-columns:repeat(4,1fr)}}
  @media (min-width:860px){#grid{grid-template-columns:repeat(6,1fr)}}
  .tile{
    position:relative;appearance:none;border:2px solid var(--line);font:inherit;cursor:pointer;
    background:var(--tile);color:var(--ink);border-radius:16px;
    min-height:76px;padding:8px 5px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-weight:700;line-height:1.1;letter-spacing:-.2px;
    font-size:clamp(14px,4.3vw,19px);
    white-space:nowrap;word-break:normal;hyphens:none;overflow:hidden;
    box-shadow:0 3px 0 rgba(42,30,46,.07);
    transition:transform .09s,box-shadow .09s,background .14s,color .14s
  }
  .tile:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,30,46,.07)}
  .tile.on{
    background:linear-gradient(140deg,var(--pink),var(--purple));
    color:#fff;border-color:transparent;
    box-shadow:0 3px 0 rgba(42,30,46,.18)
  }
  .tile.me{border-color:var(--gold);border-width:3px}
  .tile.me::after{
    content:"YOURS";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#fff;font-size:9px;font-weight:700;letter-spacing:.1em;
    padding:2px 8px;border-radius:999px;white-space:nowrap
  }
  .tile.me.on{border-color:#fff}
  .tile.me.on::after{background:#fff;color:var(--gold)}
  /* a hint that every tile is tappable, without 36 loud outlines */
  #grid.picking .tile{border-color:#FFC4DD}
  .shake{animation:shake .4s}
  @keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-5px)}}

  /* ---------- bottom bar ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;background:rgba(237,247,232,.96);
    backdrop-filter:blur(12px);border-top:2px solid var(--line);
    padding:13px 14px calc(13px + env(safe-area-inset-bottom));z-index:9
  }
  .bar .inner{max-width:580px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .msg{flex:1;min-width:0;font-size:15px;line-height:1.3;color:var(--muted);font-weight:500}
  .msg.hot{color:var(--ink);font-weight:600}
  .btn{
    appearance:none;border:0;font:inherit;font-weight:700;font-size:17px;
    padding:14px 24px;border-radius:999px;cursor:pointer;white-space:nowrap;
    box-shadow:0 3px 0 rgba(42,30,46,.18)
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,30,46,.18)}
  .btn.go{background:linear-gradient(95deg,var(--pink),var(--purple));color:#fff}
  .btn.go[disabled]{background:#D3E4CC;color:#889D82;box-shadow:none;transform:none;cursor:default}
  .btn.ghost{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:12px 16px;font-size:15px}
  footer{text-align:center;color:var(--muted);font-size:14px;font-weight:500;padding:22px 0 6px}
</style>
</head>
<body>
<div class="garland" id="garland" aria-hidden="true"></div>
<div class="sparkle" aria-hidden="true"><span>&#10022;</span><span>&#10022;</span><span>&#10022;</span><span>&#10022;</span><span>&#10022;</span><span>&#10022;</span></div>
<div class="wrap">
  <header>
    <h1 id="title">Find Your Team</h1>
    <p class="sub">Find your category!</p>
  </header>

  <div id="gate" class="gate hide">
    <label for="who">What's your first name?</label>
    <form id="gateform" autocomplete="off">
      <input id="who" type="text" inputmode="text" autocapitalize="words"
             autocorrect="off" spellcheck="false" placeholder="e.g. Riley">
      <button type="submit" id="go">Get my word</button>
    </form>
    <p id="gatemsg"></p>
  </div>

  <div id="mine" class="mine prompt"></div>
  <div id="teams"></div>
  <div id="hunt" class="hunt hide"></div>
  <div id="grid"></div>
  <footer id="foot"></footer>
</div>

<div class="bar">
  <div class="inner">
    <div class="msg" id="msg"></div>
    <button class="btn ghost" id="clear" hidden>Clear</button>
    <button class="btn go" id="check" disabled>Check</button>
  </div>
</div>

<script src="puzzle.js"></script>
<script src="roster.js"></script>
<script>
(function(){
  /* fill the paper chain to whatever width the phone is */
  (function(){
    var g = document.getElementById("garland");
    var links = Math.ceil(window.innerWidth / 24) + 6;
    var html = "";
    for (var i = 0; i < links; i++) html += "<i></i>";
    g.innerHTML = html;
  })();

  var qs = new URLSearchParams(location.search);
  var N  = parseInt(qs.get("n"), 10) || 36;
  var GROUPS = PUZZLE.activeGroups(N);
  var TEAM_SIZE_BY_ID = {};
  GROUPS.forEach(function(g){ TEAM_SIZE_BY_ID[g.id] = g.words.length; });

  var WORDS = PUZZLE.seededShuffle(PUZZLE.allActiveWords(N), 20261016);
  var KEY = "fyp:" + N;

  var state = load();
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY) || "{}");
      return { mine: s.mine || null, name: s.name || null, solved: s.solved || [],
               guesses: s.guesses || 0, found: s.found || [] };
    }catch(e){ return { mine:null, name:null, solved:[], guesses:0, found:[] }; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  /* name -> word, built from the fixed roster. First names only, lowercased,
     and matched EXACTLY - prefix matching would hand "Joe" to Joel. */
  var BY_NAME = (function(){
    if(!window.ROSTER || !ROSTER.teams) return null;
    var byId = {}, map = {}, dupes = {};
    PUZZLE.activeGroups(N).forEach(function(g){ byId[g.id] = g; });
    ROSTER.teams.forEach(function(t){
      var g = byId[t.categoryId];
      if(!g) return;
      t.people.forEach(function(person, i){
        if(i >= g.words.length) return;
        var first = String(person).trim().split(/\s+/)[0].toLowerCase();
        if(map[first]) dupes[first] = true;
        map[first] = { word:g.words[i], display:String(person).trim().split(/\s+/)[0] };
      });
    });
    Object.keys(dupes).forEach(function(k){ map[k].ambiguous = true; });
    return map;
  })();

  function editDistance(a,b){
    var m=a.length,n=b.length,prev=[],cur=[],i,j;
    for(j=0;j<=n;j++) prev[j]=j;
    for(i=1;i<=m;i++){
      cur[0]=i;
      for(j=1;j<=n;j++){
        cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a.charAt(i-1)===b.charAt(j-1)?0:1));
      }
      for(j=0;j<=n;j++) prev[j]=cur[j];
    }
    return prev[n];
  }
  function nearestNames(q){
    if(!BY_NAME) return [];
    return Object.keys(BY_NAME)
      .map(function(k){ return { k:k, d:editDistance(q,k) }; })
      .filter(function(x){ return x.d <= 2; })
      .sort(function(a,b){ return a.d - b.d; })
      .slice(0,3)
      .map(function(x){ return BY_NAME[x.k].display; });
  }

  /* Everyone on the roster, flattened with the word they actually hold.
     Teammates are derived from PEOPLE, not from the word list, so the three
     unclaimed spare words never become phantom teammates to hunt for. */
  var PEOPLE = (function(){
    if(!window.ROSTER || !ROSTER.teams) return [];
    var byId = {}, out = [];
    PUZZLE.activeGroups(N).forEach(function(g){ byId[g.id] = g; });
    ROSTER.teams.forEach(function(t){
      var g = byId[t.categoryId];
      if(!g) return;
      t.people.forEach(function(person, i){
        if(i >= g.words.length) return;
        var nm = String(person).trim();
        out.push({ first: nm.split(/\s+/)[0].toLowerCase(),
                   display: nm.split(/\s+/)[0],
                   word: g.words[i], groupId: g.id });
      });
    });
    return out;
  })();

  var picking = !state.mine;
  var sel = [];

  var $grid=document.getElementById("grid"), $teams=document.getElementById("teams"),
      $mine=document.getElementById("mine"), $msg=document.getElementById("msg"),
      $check=document.getElementById("check"), $clear=document.getElementById("clear"),
      $foot=document.getElementById("foot");

  document.getElementById("title").textContent = PUZZLE.title;
  document.title = PUZZLE.title;

  /* The category colours are deliberately bright, so pick each card's text
     colour from its background rather than assuming dark ink reads on all. */
  function inkOn(hex){
    var c = hex.replace("#","");
    var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return ((r*299 + g*587 + b*114) / 1000) >= 150 ? "#2A1E2E" : "#FFFFFF";
  }

  function solvedWords(){
    var out = {};
    state.solved.forEach(function(id){
      var g = GROUPS.find(function(x){ return x.id===id; });
      if(g) g.words.forEach(function(w){ out[w]=1; });
    });
    return out;
  }

  function myGroup(){ return state.mine ? PUZZLE.groupOf(state.mine, N) : null; }

  /* Teams can differ in size when the headcount isn't a multiple of 6, so a
     guess is checkable whenever it matches ANY unsolved team's size. */
  function openSizes(){
    var sizes = {};
    GROUPS.forEach(function(g){
      if(state.solved.indexOf(g.id) === -1) sizes[g.words.length] = 1;
    });
    return Object.keys(sizes).map(Number);
  }
  function maxOpen(){
    return openSizes().reduce(function(a,b){ return Math.max(a,b); }, 0);
  }
  function checkable(){ return openSizes().indexOf(sel.length) > -1; }

  function render(){
    var done = solvedWords();
    var mg = myGroup();

    /* your-word card */
    if(picking){
      $mine.className = "mine prompt";
      $mine.innerHTML = "🎉 Tap your word below to start";
    } else {
      $mine.className = "mine";
      $mine.innerHTML = '<div class="lab">' + (state.name ? state.name + " — your word" : "Your word") +
        '</div><b>' + state.mine + '</b>' +
        '<button id="rp">not you? change</button>';
      document.getElementById("rp").onclick = function(){
        picking = true; sel = [];
        state.name = null;
        if($who) $who.value = "";
        if($gatemsg){ $gatemsg.className = ""; $gatemsg.textContent = ""; }
        render();
      };
    }

    /* solved teams */
    $teams.innerHTML = "";
    state.solved.forEach(function(id){
      var g = GROUPS.find(function(x){ return x.id===id; });
      if(!g) return;
      var mineHere = mg && mg.id === g.id;
      var el = document.createElement("div");
      el.className = "team" + (mineHere ? " yours" : "");
      el.style.background = g.color;
      el.style.color = inkOn(g.color);
      el.innerHTML = '<div class="label">' + (mineHere ? "🎈 YOUR TEAM" : "TEAM") + '</div>' +
                     '<div class="name">' + g.name + '</div>' +
                     '<div class="ws">' + g.words.join(" · ") + '</div>';
      $teams.appendChild(el);
    });

    /* grid */
    $grid.innerHTML = "";
    $grid.className = picking ? "picking" : "";
    var remaining = 0;
    WORDS.forEach(function(w){
      if(done[w]) return;
      remaining++;
      var b = document.createElement("button");
      b.className = "tile" + (sel.indexOf(w)>-1 ? " on":"") + (state.mine===w ? " me":"");
      var inner = document.createElement("span");
      inner.textContent = w;
      b.appendChild(inner);
      b.onclick = function(){ tap(w); };
      $grid.appendChild(b);
    });
    $grid.style.display = remaining ? "" : "none";
    fitTiles();

    /* bar */
    var target = mg ? TEAM_SIZE_BY_ID[mg.id] : maxOpen();
    $clear.hidden = sel.length === 0;
    $check.disabled = !checkable();
    if(picking){
      $msg.textContent = BY_NAME
        ? "Enter your name above to get your word."
        : "Which one is yours?";
      $msg.className = "msg hot";
      $check.disabled = true;
    } else if(mg && state.solved.indexOf(mg.id) > -1){
      $msg.innerHTML = "You're on <b>" + mg.name + "</b> — go find them!";
      $msg.className = "msg hot";
    } else {
      $msg.textContent = sel.length
        ? "Selected " + sel.length + " of " + target
        : "Pick the " + target + " words that go together.";
      $msg.className = "msg";
    }
    renderGate();
    renderHunt();
    /* Once you're hunting, your own progress matters more than the board's. */
    var mates = myTeammates();
    if(mg && state.solved.indexOf(mg.id) > -1 && mates.length){
      var got = state.found.filter(function(w){
        return mates.some(function(m){ return m.word === w; });
      }).length;
      $foot.textContent = got + " of " + mates.length + " teammates found";
    } else {
      $foot.textContent = state.guesses
        ? state.solved.length + " of " + GROUPS.length + " teams found · " + state.guesses + " guess" + (state.guesses===1?"":"es")
        : state.solved.length + " of " + GROUPS.length + " teams found";
    }
  }

  /* CHOCOLATE and ROTISSERIE are wider than a tile at the base size, and a
     mid-word wrap ("CHOCOLAT / E") looks broken. Keep every word on one line
     and step the type down only as far as that particular word needs. */
  function fitTiles(){
    var tiles = $grid.querySelectorAll(".tile");
    for (var i = 0; i < tiles.length; i++){
      var t = tiles[i], span = t.firstChild;
      if(!span) continue;
      span.style.fontSize = "";
      var room = t.clientWidth - 12;
      var size = parseFloat(window.getComputedStyle(t).fontSize);
      var guard = 0;
      while (span.offsetWidth > room && size > 10.5 && guard++ < 40){
        size -= 0.5;
        span.style.fontSize = size + "px";
      }
    }
  }
  window.addEventListener("resize", fitTiles);
  window.addEventListener("orientationchange", function(){ setTimeout(fitTiles, 120); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitTiles);

  function tap(w){
    if(picking){
      /* While the name gate is up, tiles must not assign. Otherwise someone
         idly poking the board silently ends up with the wrong word. */
      if(BY_NAME){
        if($who) $who.focus();
        if($gatemsg && !$gatemsg.textContent){
          $gatemsg.className = "";
          $gatemsg.textContent = "Enter your name first and I'll give you your word.";
        }
        return;
      }
      state.mine = w; picking = false; sel = []; save(); render(); return;
    }
    var i = sel.indexOf(w);
    if(i > -1){ sel.splice(i,1); }
    else {
      if(sel.length >= maxOpen()) return;
      sel.push(w);
    }
    render();
  }

  /* ---------- phase 2: hunt for your people ---------- */
  var $hunt = document.getElementById("hunt"), $bar = document.querySelector(".bar");

  function myTeammates(){
    var mg = myGroup();
    if(!mg) return [];
    return PEOPLE.filter(function(p){
      return p.groupId === mg.id && p.word !== state.mine;
    });
  }

  var peeking = false;

  function renderHunt(){
    var mg = myGroup();
    var mates = myTeammates();
    var inHunt = mg && state.solved.indexOf(mg.id) > -1 && mates.length > 0;

    if(!inHunt){
      $hunt.classList.add("hide");
      $grid.classList.remove("hide");
      $bar.classList.remove("hide");
      return;
    }

    var found = state.found.filter(function(w){
      return mates.some(function(m){ return m.word === w; });
    });
    var complete = found.length === mates.length;

    /* once you are hunting, the grid is noise - keep it one tap away */
    $grid.classList.toggle("hide", !peeking);
    $bar.classList.toggle("hide", !peeking);
    $hunt.classList.remove("hide");

    if(complete){
      $hunt.className = "done";
      $hunt.innerHTML =
        "<h2>🎉 Team complete!</h2>" +
        '<div class="time">' + mg.name + "</div><ul>" +
        [{display: state.name || "You", word: state.mine}].concat(mates).map(function(p){
          return "<li>" + p.display + "<span>" + p.word + "</span></li>";
        }).join("") +
        "</ul>";
      return;
    }

    $hunt.className = "hunt";
    $hunt.innerHTML =
      "<h2>Now go find them</h2>" +
      '<div class="prog">' + found.length + " of " + mates.length +
        " found · go ask people what their word is</div>" +
      '<form id="huntform" autocomplete="off">' +
        '<input id="mate" type="text" autocapitalize="words" autocorrect="off" ' +
               'spellcheck="false" placeholder="Their first name">' +
        '<button type="submit" class="add">Add</button>' +
      "</form>" +
      '<div class="slots">' +
        mates.map(function(m){
          var got = found.indexOf(m.word) > -1;
          return '<div class="slot' + (got ? " got" : "") + '"' +
                 (got ? ' style="background:' + mg.color + ';color:' + inkOn(mg.color) + '"' : "") +
                 '><span class="w">' + (got ? m.word : "? ? ?") + '</span>' +
                 '<span class="n">' + (got ? m.display : "not found yet") + "</span></div>";
        }).join("") +
      "</div>" +
      '<p class="say" id="huntsay"></p>' +
      '<button class="peek" id="peek">' + (peeking ? "hide the board" : "peek at the board") + "</button>";

    document.getElementById("peek").onclick = function(){ peeking = !peeking; render(); };

    document.getElementById("huntform").onsubmit = function(e){
      e.preventDefault();
      var $mate = document.getElementById("mate"), $say = document.getElementById("huntsay");
      var raw = ($mate.value || "").trim();
      if(!raw) return;
      var q = raw.split(/\s+/)[0].toLowerCase();
      var hit = PEOPLE.filter(function(p){ return p.first === q; });

      if(!hit.length){
        $say.className = "say bad";
        $say.textContent = "No " + raw + " here — check the spelling?";
        return;
      }
      if(hit.length > 1){
        $say.className = "say bad";
        $say.textContent = "There's more than one " + hit[0].display + " — ask Sarah.";
        return;
      }
      var who = hit[0];
      if(who.word === state.mine){
        $say.className = "say bad";
        $say.textContent = "That's you!";
        return;
      }
      if(state.found.indexOf(who.word) > -1){
        $say.className = "say";
        $say.textContent = "You already found " + who.display + ".";
        $mate.value = "";
        return;
      }
      if(who.groupId !== mg.id){
        $say.className = "say bad";
        $say.textContent = who.display + " isn't on your team. Keep looking!";
        $mate.value = "";
        return;
      }
      state.found.push(who.word);
      save();
      $mate.value = "";
      render();
      var s2 = document.getElementById("huntsay");
      if(s2){ s2.className = "say good"; s2.textContent = "Got " + who.display + "!"; }
    };
  }

  /* ---------- name gate ---------- */
  var $gate=document.getElementById("gate"), $who=document.getElementById("who"),
      $gatemsg=document.getElementById("gatemsg"), $gateform=document.getElementById("gateform");

  function gateVisible(){ return BY_NAME && picking; }

  function renderGate(){
    if(gateVisible()){
      $gate.classList.remove("hide");
      $mine.classList.add("hide");
    } else {
      $gate.classList.add("hide");
      $mine.classList.remove("hide");
    }
  }

  $gateform.onsubmit = function(e){
    e.preventDefault();
    var raw = ($who.value || "").trim();
    if(!raw){ return; }
    var q = raw.split(/\s+/)[0].toLowerCase();
    var hit = BY_NAME[q];

    if(hit && hit.ambiguous){
      $gatemsg.className = "bad";
      $gatemsg.textContent = "There's more than one " + hit.display + " here — ask Sarah which word is yours.";
      return;
    }
    if(hit){
      state.mine = hit.word;
      state.name = hit.display;
      picking = false;
      sel = [];
      save();
      $gatemsg.textContent = "";
      render();
      return;
    }

    var near = nearestNames(q);
    $gatemsg.className = "bad";
    $gatemsg.innerHTML = "No <b>" + raw.replace(/[<>&]/g,"") + "</b> on the list. " +
      (near.length ? "Did you mean <b>" + near.join("</b> or <b>") + "</b>? " : "") +
      '<button type="button" class="alt" id="selfpick">Pick my word myself</button>';
    var sp = document.getElementById("selfpick");
    if(sp) sp.onclick = function(){
      $gatemsg.className = "";
      $gatemsg.textContent = "Tap your word in the grid below.";
      $gate.classList.add("hide");
      $mine.classList.remove("hide");
      BY_NAME = null;           /* fall back to the original tap-to-pick flow */
      render();
    };
  };

  $clear.onclick = function(){ sel = []; render(); };

  $check.onclick = function(){
    if($check.disabled) return;
    state.guesses++;

    /* how many of the selection land in each group? */
    var tally = {};
    sel.forEach(function(w){
      var g = PUZZLE.groupOf(w, N);
      if(g) tally[g.id] = (tally[g.id] || 0) + 1;
    });
    var bestId = null, best = 0;
    Object.keys(tally).forEach(function(id){
      if(tally[id] > best){ best = tally[id]; bestId = id; }
    });
    var g = GROUPS.find(function(x){ return x.id === bestId; });

    if(g && best === sel.length && sel.length === g.words.length){
      state.solved.push(g.id);
      sel = [];
      save(); render();
      return;
    }

    save();
    $grid.classList.add("shake");
    setTimeout(function(){ $grid.classList.remove("shake"); }, 420);
    render();

    /* Only the classic "one away" is worth saying out loud. An exact count
       on every miss turns the board into a solver and kills the puzzle. */
    $msg.textContent = (best === sel.length - 1)
      ? "So close — one of these doesn't belong."
      : "Not a team. Look again.";
    $msg.className = "msg hot";
  };

  render();
})();
</script>
</body>
</html>
