<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<title>Find Your People</title>
<style>
  :root{
    --bg:#faf7f2; --surface:#ffffff; --tile:#efe6d9; --tile-press:#e4d7c6;
    --ink:#1c1a17; --muted:#6c655c; --line:#ded3c4; --sel:#1c1a17; --sel-ink:#faf7f2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    padding:0 14px calc(104px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}

  header{padding:22px 2px 14px;text-align:center}
  h1{margin:0;font-size:25px;letter-spacing:-.3px;font-weight:800}
  .sub{margin:7px auto 0;max-width:34ch;font-size:14px;line-height:1.45;color:var(--muted)}

  /* --- your word --- */
  .mine{
    display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin:0 0 14px;font-size:14px
  }
  .mine b{font-size:17px;letter-spacing:.02em}
  .mine button{
    appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);
    font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer
  }
  .mine.prompt{background:#1c1a17;border-color:#1c1a17;color:#faf7f2;font-weight:600;justify-content:center}
  .mine.prompt button{background:transparent;border-color:#5a564f;color:#cfc8bd}

  /* --- solved teams --- */
  .team{
    border-radius:14px;padding:13px 14px;margin-bottom:9px;color:#1c1a17;
    animation:pop .32s cubic-bezier(.2,1.3,.5,1)
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .team .label{font-size:11px;font-weight:800;letter-spacing:.1em;opacity:.65}
  .team .name{font-size:18px;font-weight:800;margin:2px 0 5px;letter-spacing:-.2px}
  .team .ws{font-size:13px;line-height:1.5;font-weight:600;opacity:.85}
  .team.yours{box-shadow:0 0 0 3px var(--ink)}

  /* --- grid --- */
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
  @media (max-width:360px){#grid{grid-template-columns:repeat(3,1fr)}}
  @media (min-width:520px){#grid{grid-template-columns:repeat(6,1fr)}}
  .tile{
    position:relative;appearance:none;border:0;font:inherit;cursor:pointer;
    background:var(--tile);color:var(--ink);border-radius:9px;
    min-height:62px;padding:6px 3px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-weight:800;letter-spacing:.01em;line-height:1.08;
    font-size:clamp(10px,3.1vw,14px);word-break:break-word;hyphens:auto;
    transition:background .12s,transform .08s
  }
  .tile:active{transform:scale(.95);background:var(--tile-press)}
  .tile.on{background:var(--sel);color:var(--sel-ink)}
  .tile.me::after{
    content:"";position:absolute;inset:-3px;border:2.5px solid var(--ink);
    border-radius:12px;pointer-events:none
  }
  .tile.me.on::after{border-color:#b9ad9b}
  #grid.picking .tile{box-shadow:inset 0 0 0 1.5px rgba(28,26,23,.2)}
  .shake{animation:shake .4s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}

  /* --- bottom bar --- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;background:rgba(250,247,242,.94);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:11px 14px calc(11px + env(safe-area-inset-bottom));z-index:9
  }
  .bar .inner{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:center}
  .msg{flex:1;min-width:0;font-size:13px;line-height:1.3;color:var(--muted)}
  .msg.hot{color:var(--ink);font-weight:700}
  .btn{
    appearance:none;border:0;font:inherit;font-weight:800;font-size:15px;
    padding:12px 18px;border-radius:999px;cursor:pointer;white-space:nowrap
  }
  .btn.go{background:var(--ink);color:var(--bg)}
  .btn.go[disabled]{background:#ded3c4;color:#8d8679;cursor:default}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:11px 14px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Find Your People</h1>
    <p class="sub">You got one word by text. Find the others whose words belong with yours — they're your team.</p>
  </header>

  <div id="mine" class="mine prompt"></div>
  <div id="teams"></div>
  <div id="grid"></div>
  <footer id="foot"></footer>
</div>

<div class="bar">
  <div class="inner">
    <div class="msg" id="msg"></div>
    <button class="btn ghost" id="clear" hidden>Clear</button>
    <button class="btn go" id="check" disabled>Check</button>
  </div>
</div>

<script src="puzzle.js"></script>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var N  = parseInt(qs.get("n"), 10) || 36;
  var GROUPS = PUZZLE.activeGroups(N);
  var TEAM_SIZE_BY_ID = {};
  GROUPS.forEach(function(g){ TEAM_SIZE_BY_ID[g.id] = g.words.length; });

  var WORDS = PUZZLE.seededShuffle(PUZZLE.allActiveWords(N), 20261016);
  var KEY = "fyp:" + N;

  var state = load();
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY) || "{}");
      return { mine: s.mine || null, solved: s.solved || [], guesses: s.guesses || 0 };
    }catch(e){ return { mine:null, solved:[], guesses:0 }; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var picking = !state.mine;
  var sel = [];

  var $grid=document.getElementById("grid"), $teams=document.getElementById("teams"),
      $mine=document.getElementById("mine"), $msg=document.getElementById("msg"),
      $check=document.getElementById("check"), $clear=document.getElementById("clear"),
      $foot=document.getElementById("foot");

  document.getElementById("title").textContent = PUZZLE.title;
  document.title = PUZZLE.title;

  function solvedWords(){
    var out = {};
    state.solved.forEach(function(id){
      var g = GROUPS.find(function(x){ return x.id===id; });
      if(g) g.words.forEach(function(w){ out[w]=1; });
    });
    return out;
  }

  function myGroup(){ return state.mine ? PUZZLE.groupOf(state.mine, N) : null; }

  /* Teams can differ in size when the headcount isn't a multiple of 6, so a
     guess is checkable whenever it matches ANY unsolved team's size. */
  function openSizes(){
    var sizes = {};
    GROUPS.forEach(function(g){
      if(state.solved.indexOf(g.id) === -1) sizes[g.words.length] = 1;
    });
    return Object.keys(sizes).map(Number);
  }
  function maxOpen(){
    return openSizes().reduce(function(a,b){ return Math.max(a,b); }, 0);
  }
  function checkable(){ return openSizes().indexOf(sel.length) > -1; }

  function render(){
    var done = solvedWords();
    var mg = myGroup();

    /* your-word strip */
    if(picking){
      $mine.className = "mine prompt";
      $mine.innerHTML = "👇 Tap your word below to get started";
    } else {
      $mine.className = "mine";
      $mine.innerHTML = '<span>Your word</span><b>' + state.mine + '</b>' +
        '<button id="rp">change</button>';
      document.getElementById("rp").onclick = function(){
        picking = true; sel = []; render();
      };
    }

    /* solved teams */
    $teams.innerHTML = "";
    state.solved.forEach(function(id){
      var g = GROUPS.find(function(x){ return x.id===id; });
      if(!g) return;
      var mineHere = mg && mg.id === g.id;
      var el = document.createElement("div");
      el.className = "team" + (mineHere ? " yours" : "");
      el.style.background = g.color;
      el.innerHTML = '<div class="label">' + (mineHere ? "YOUR TEAM" : "TEAM") + '</div>' +
                     '<div class="name">' + g.name + '</div>' +
                     '<div class="ws">' + g.words.join(" · ") + '</div>';
      $teams.appendChild(el);
    });

    /* grid */
    $grid.innerHTML = "";
    $grid.className = picking ? "picking" : "";
    var remaining = 0;
    WORDS.forEach(function(w){
      if(done[w]) return;
      remaining++;
      var b = document.createElement("button");
      b.className = "tile" + (sel.indexOf(w)>-1 ? " on":"") + (state.mine===w ? " me":"");
      b.textContent = w;
      b.onclick = function(){ tap(w); };
      $grid.appendChild(b);
    });
    if(!remaining) $grid.style.display = "none"; else $grid.style.display = "";

    /* bar */
    var target = mg ? TEAM_SIZE_BY_ID[mg.id] : maxOpen();
    $clear.hidden = sel.length === 0;
    $check.disabled = !checkable();
    if(picking){
      $msg.textContent = "Which one is yours?";
      $msg.className = "msg hot";
      $check.disabled = true;
    } else if(mg && state.solved.indexOf(mg.id) > -1){
      $msg.innerHTML = "You're on <b>" + mg.name + "</b> — go find them.";
      $msg.className = "msg hot";
    } else {
      $msg.textContent = sel.length
        ? "Selected " + sel.length + " of " + target
        : "Pick the " + target + " words that go together.";
      $msg.className = "msg";
    }
    $foot.textContent = state.guesses
      ? state.solved.length + " of " + GROUPS.length + " teams found · " + state.guesses + " guess" + (state.guesses===1?"":"es")
      : state.solved.length + " of " + GROUPS.length + " teams found";
  }

  function tap(w){
    if(picking){
      state.mine = w; picking = false; sel = []; save(); render(); return;
    }
    var i = sel.indexOf(w);
    if(i > -1){ sel.splice(i,1); }
    else {
      if(sel.length >= maxOpen()) return;
      sel.push(w);
    }
    render();
  }

  $clear.onclick = function(){ sel = []; render(); };

  $check.onclick = function(){
    if($check.disabled) return;
    state.guesses++;

    /* how many of the selection land in each group? */
    var tally = {};
    sel.forEach(function(w){
      var g = PUZZLE.groupOf(w, N);
      if(g) tally[g.id] = (tally[g.id] || 0) + 1;
    });
    var bestId = null, best = 0;
    Object.keys(tally).forEach(function(id){
      if(tally[id] > best){ best = tally[id]; bestId = id; }
    });
    var g = GROUPS.find(function(x){ return x.id === bestId; });

    if(g && best === sel.length && sel.length === g.words.length){
      state.solved.push(g.id);
      sel = [];
      save(); render();
      return;
    }

    save();
    $grid.classList.add("shake");
    setTimeout(function(){ $grid.classList.remove("shake"); }, 420);
    render();
    /* Only the classic "one away" is worth saying out loud. An exact count
       on every miss turns the board into a solver and kills the puzzle. */
    $msg.textContent = (best === sel.length - 1)
      ? "So close — one of these doesn't belong."
      : "Not a team. Look again.";
    $msg.className = "msg hot";
  };

  render();
})();
</script>
</body>
</html>
